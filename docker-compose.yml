# Local stack: API + static frontend behind nginx.
#   docker compose up --build   ->   http://localhost:8080

services:
  api:
    build: ./backend
    environment:
      # The browser only ever talks to nginx, which proxies /api to this
      # service, so no cross-origin requests are made in the compose stack.
      ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:5173"
      PORT: "8000"
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        # Empty: the frontend calls /api on its own origin and nginx proxies it.
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
