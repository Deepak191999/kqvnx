server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames are immutable; the entry HTML never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # In the compose stack the API is a sibling container, so the browser can
    # stay same-origin and CORS never enters the picture.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health {
        proxy_pass http://api:8000/health;
    }
}
